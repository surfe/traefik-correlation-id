services:

  traefik:
    image: "traefik:v3.7.1"
    container_name: "traefik"
    command:
#      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--experimental.localPlugins.correlation.moduleName=github.com/surfe/traefik-correlation-id"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.middlewares=correlation@docker" # you can use this for global middleware activation on web
#      - "--entrypoints.websecure.http.middlewares=correlation@docker" # enable once websecure entrypoint and TLS are configured
    ports:
      - "80:80"
      - "8080:8080"
#    labels:
#      - "traefik.http.middlewares.correlation.plugin.correlation.headerName=x-correlation-id"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./:/plugins-local/src/github.com/surfe/traefik-correlation-id/"


  whoami:
    image: "traefik/whoami"
    container_name: "simple-service"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.middlewares.correlation.plugin.correlation.headerName=x-correlation-id"
#     - "traefik.http.routers.whoami.middlewares=correlation@docker" # you can use this for service middleware activation